title: Suspicious Off-Hours Multi-System Authentication
id: soc-ai-hunt-001
status: experimental

description: >
  Detects authentication activity involving an unusual source IP
  during off-hours with rapid access to multiple systems.

author: SOC-AI-Hunt

date: 2026/09/01

logsource:
  category: authentication

detection:

  selection_off_hours:
    hour:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6

  selection_rare_ip:
    rare_ip: true

  selection_rapid_access:
    rapid_multi_system: true

  condition:
    selection_off_hours
    and selection_rare_ip
    and selection_rapid_access

falsepositives:
  - Scheduled maintenance
  - Administrative activity
  - Automated management systems
  - Legitimate after-hours operations

level: high

tags:
  - attack.credential_access
  - attack.valid_accounts
  - attack.lateral_movement